<figure class="article-figure" id="figure-{{ include.id }}">

  <img
    src="{{ include.src | relative_url }}"
    alt="{{ include.alt | default: include.caption | escape }}"
    loading="lazy"
  >

  {% if include.caption %}
    <figcaption class="figure-caption">

      <span class="figure-number"></span>

      {{ include.caption }}

      {% if include.source %}
        <span class="figure-source">
          Source:
          {% if include.source_url %}
            <a href="{{ include.source_url }}"
               target="_blank"
               rel="noopener noreferrer">{{ include.source }}</a>
          {% else %}
            {{ include.source }}
          {% endif %}
        </span>
      {% endif %}

      {% if include.license %}
        <span class="figure-source">
          License: {{ include.license }}
        </span>
      {% endif %}

    </figcaption>
  {% endif %}

</figure>
