<figure class="article-figure" id="figure-{{ include.id }}">

  <img
    src="{{ include.src | relative_url }}"
    alt="{{ include.alt | default: include.caption | escape }}"
    loading="lazy"
  >

  {% if include.caption %}
    <figcaption class="figure-caption">

      <span class="figure-number"></span>

      {{ include.caption }}

      {% if include.source %}
        <span class="figure-source">
          Source: {{ include.source }}
        </span>
      {% endif %}

    </figcaption>
  {% endif %}

</figure>
