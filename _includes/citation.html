{%- assign reference = site.data.references[include.key] -%}
{%- if reference -%}
{%- assign surname = reference.author | split: ", " | first -%}
<a class="citation" href="#ref-{{ include.key }}">({{ surname }}, {{ reference.year }})</a>
{%- else -%}
<span class="citation-error">[Reference not found: {{ include.key }}]</span>
{%- endif -%}
