---
layout: default
---

<article class="article-page">

  <header class="article-header">

    <h1>{{ page.title }}</h1>

    <p class="article-date">
      {{ page.date | date: "%B %-d, %Y" }}
    </p>

    <div class="article-tags">
      {% for tag in page.tags %}
        <span class="article-tag">{{ tag }}</span>
      {% endfor %}
    </div>

  </header>

  <div class="article-content">
    {{ content }}
  </div>

</article>
