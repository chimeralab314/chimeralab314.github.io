<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description"
      content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>

  <header class="site-header">
    <div class="header-container">

      <a class="site-title" href="{{ '/' | relative_url }}">
        Chimera Lab
      </a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Blog</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>

    </div>
  </header>

  <main class="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      © {{ site.time | date: "%Y" }} Chimera Lab
    </p>
  </footer>

</body>
</html>
